apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: tpt-frontend
  namespace: appsec
  labels:
    team: appsec
spec:
  ingresses:
    - https://tpt.ansatt.nav.no
    - https://tpt.nav.no/api/github/copilot/callback
  azure:
    application:
      enabled: true
      allowAllUsers: true
    sidecar:
      enabled: true
      autoLogin: true
      autoLoginIgnorePaths:
        - /api/github/copilot/callback
  accessPolicy:
    outbound:
      rules:
        - application: tpt-backend
  image: {{image}}
  port: 8080
  liveness:
    initialDelay: 20
    path: api/health
  readiness:
    initialDelay: 20
    path: api/health
  replicas:
    max: 2
    min: 2
  resources:
    limits:
      memory: 384Mi
    requests:
      cpu: 10m
      memory: 196Mi
  observability:
    autoInstrumentation:
      enabled: true
      runtime: nodejs
    logging:
      destinations:
        - id: loki
  env:
    # Telemetry URL accessed at runtime via server-side API
    - name: TELEMETRY_URL
      value: https://telemetry.nav.no/collect
    - name: COPILOT_COMPLETE_URL
      value: https://tpt.ansatt.nav.no/api/github/copilot/complete
  envFrom:
    - secret: tpt-frontend
